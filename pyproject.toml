[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exercise-rep-counter"
version = "0.1.0"
description = "Skeleton-based exercise phase classification and repetition counting"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scipy>=1.12,<2",
    "scikit-learn>=1.4,<2",
    "opencv-python-headless>=4.9,<6",
    "mediapipe>=0.10.14,<0.11",
    "torch>=2.2,<3",
    "matplotlib>=3.8,<4",
    "seaborn>=0.13,<1",
    "tqdm>=4.66,<5",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4,<5"]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]
